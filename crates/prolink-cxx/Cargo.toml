[package]
name = "prolink-cxx"
description = "A C++ binding for prolink, generated by cxx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/prolink-cxx"
homepage.workspace = true
readme = "README.md"
keywords = ["pioneer", "dj", "cxx", "cdj"]
categories = ["api-bindings", "multimedia::audio"]

[lib]
# `staticlib` so a C++ build can link the whole thing in one archive; `rlib`
# so the bridge's own tests can call it as ordinary Rust.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Through the workspace, which carries a version beside the path: a path
# without one cannot be packaged, since crates.io has no `../prolink` to
# resolve against.
prolink.workspace = true
prolink-proto.workspace = true
prolink-rekordbox.workspace = true
cxx = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber.workspace = true

[build-dependencies]
cxx-build = "1"

# **Not** `lints.workspace = true`, and this is the only crate in the workspace
# that does not inherit it. The workspace *forbids* `unsafe_code`, and `forbid`
# cannot be lifted by an inner `allow` — which is the point of it everywhere
# else. The `cxx::bridge` macro expands to the extern declarations that make
# the two languages agree, and those cannot be written safely. So this crate
# denies unsafe instead: the bridge module is the single exemption, and no
# hand-written code here or in any other crate loses the guarantee.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# `unused_qualifications` is omitted: the bridge macro emits fully-qualified
# paths for the shared structs, and there is no way to write them otherwise.
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
